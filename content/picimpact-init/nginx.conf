# PicImpact 入口 nginx 配置（懒猫微服）
# 路径分流：
#   /picimpact/*  → 对象存储（RustFS，S3 API :9000）——路径原样透传！
#     S3 预签名校验基于请求原始路径与 Host，任何路径改写都会导致签名不匹配；
#     因此这里 proxy_pass 不带 URI 部分，且保留客户端 Host。
#   其余          → 应用（Next.js :3000）
#   /healthz      → nginx 本地响应（供平台与容器探针使用，不依赖应用）
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # 懒猫：保留平台网关传入的 X-Forwarded-Proto（评审走 https），缺失时退回 $scheme
    map $http_x_forwarded_proto $lzc_forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    server {
        listen 80;
        server_name _;
        client_max_body_size 2048m;

        # 用变量上游 + 容器内置 DNS：启动时不做一次性解析，
        # 避免依赖容器晚于本容器启动时 nginx 直接退出（host not found in upstream）。
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $app_upstream picimpact:3000;
        set $s3_upstream picimpact-s3:9000;

        location = /healthz {
            default_type text/plain;
            return 200 "ok";
        }

        # 对象存储（S3 API）：路径与 Host 原样转发
        location ^~ /picimpact {
            proxy_pass http://$s3_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # 应用
        location / {
            proxy_pass http://$app_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $lzc_forwarded_proto;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_http_version 1.1;
            proxy_read_timeout 120s;
        }
    }
}
